name: Apply live Cloudflare theme once

on:
  push:
    paths:
      - '.github/workflows/apply-live-cloudflare-theme-once.yml'

permissions:
  contents: write

jobs:
  apply-live-theme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply palette to live Cloudflare-rendered dictionary
        shell: python
        run: |
          from pathlib import Path
          import re

          # Cloudflare serves these preview assets at / and /en/.
          for filename in ['dictionary-d1-preview.html', 'dictionary-d1-preview-en.html']:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text = re.sub(
                  r'<meta\s+name=["\']theme-color["\']\s+content=["\'][^"\']+["\']\s*/?>',
                  '<meta name="theme-color" content="#14213A">',
                  text,
                  count=1,
                  flags=re.I,
              )
              path.write_text(text, encoding='utf-8')

          middleware = Path('functions/_middleware.js')
          text = middleware.read_text(encoding='utf-8')
          marker = '/* ATS LIVE NAVY-BURGUNDY-GOLD THEME */'
          if marker not in text:
              start = text.index('const DICTIONARY_VISUAL_POLISH = `')
              end = text.index('</style>`;', start)
              override = r'''
/* ATS LIVE NAVY-BURGUNDY-GOLD THEME */
:root{
  --paper:#F7F3EA!important;
  --paper-2:#F2ECDD!important;
  --ink:#14213A!important;
  --muted:#5C5646!important;
  --line:#DED5C2!important;
  --line-soft:#E7DFCF!important;
  --accent:#7A2231!important;
  --accent-soft:#F3E8E8!important;
  --ats-navy:#14213A!important;
  --ats-navy-deep:#22405E!important;
  --claude-canvas:#F7F3EA!important;
  --claude-surface:#FFFDF8!important;
}
html,body{background:#F7F3EA!important;color:#14213A!important}
body{background-image:none!important;background-color:#F7F3EA!important}
.preview-site-nav a{color:#14213A!important}
.preview-site-nav a:hover,.preview-site-nav a:focus-visible{color:#7A2231!important;border-bottom-color:#C9A227!important}
.preview-eyebrow{color:#7A2231!important}
.preview-title__top,.preview-title__main,.preview-title__date{color:#14213A!important}
.preview-title__date::before,.preview-title__date::after,.preview-eyebrow::before,.preview-eyebrow::after{background:#C9A227!important;border-color:#C9A227!important}
.preview-beta{color:#7A2231!important}
.lang-switch{background:#FFFDF8!important;border-color:#DED5C2!important}
.lang-switch a{color:#14213A!important}
.lang-switch a.active{background:#14213A!important;color:#F7F3EA!important}
.preview-search-row{background:#FFFDF8!important;border-color:#DED5C2!important}
.preview-search-row:hover{border-color:#C9A227!important}
.preview-search-row:focus-within{border-color:#7A2231!important;box-shadow:0 0 0 3px rgba(122,34,49,.10)!important}
.preview-search-row input{background:#FFFDF8!important;color:#14213A!important}
.preview-search-row input::placeholder{color:#8A8578!important}
.result-title,.result-count{color:#7A2231!important}
.result-title::before,.result-title::after{background:#C9A227!important}
.result-count{background:#FFFDF8!important;border-color:#DED5C2!important}
.list-head{background:#14213A!important;border-top-color:#14213A!important;border-bottom-color:#14213A!important;box-shadow:none!important}
.list-head span{color:#C9A227!important;text-shadow:none!important}
.list{background:transparent!important}
.row{background:#FFFDF8!important;border-bottom-color:#DED5C2!important}
.row:nth-child(even){background:#F2ECDD!important}
.row:hover,.row:focus-visible{background:#EFE7D5!important;border-bottom-color:#C9A227!important}
.cell{border-right-color:#DED5C2!important}
.cell h2{color:#14213A!important}
.row:hover .cell h2{color:#7A2231!important}
.label{color:#7A2231!important}
.value{color:#4A4438!important}
.cell-modern .value,.cell-ottoman .value{color:#4A4438!important}
.cell-explanation .value{color:#5C5646!important}
.speak,.open-entry{color:#22405E!important}
.speak:hover,.speak:focus-visible,.open-entry:hover{color:#7A2231!important;background:#F2ECDD!important}
.speak[aria-pressed="true"]{background:#7A2231!important;color:#FFFDF8!important}
.pager strong{color:#7A2231!important}
.pager-arrow{background:#FFFDF8!important;border-color:#DED5C2!important;color:#14213A!important}
.pager-arrow:hover,.pager-arrow:focus-visible{background:#14213A!important;border-color:#14213A!important;color:#C9A227!important}
.dialog{background:#F7F3EA!important;border-color:#DED5C2!important}
.dialog-head,.detail-card{background:#FFFDF8!important;border-color:#DED5C2!important}
.dialog-kicker{color:#7A2231!important}
.dialog h2{color:#14213A!important}
.detail-card::before{background:#C9A227!important}
.site-footer,.preview-footer{background:#F7F3EA!important;border-top-color:#C9A227!important;color:#5C5646!important}
.site-footer a,.preview-footer a{color:#14213A!important}
.site-footer a:hover,.preview-footer a:hover{color:#7A2231!important}
::selection{background:#E4D6A2!important;color:#14213A!important}
'''
              text = text[:end] + override + text[end:]

          # Also replace the old polish palette where it is explicitly hard-coded.
          replacements = {
              '#f8f8f6':'#F7F3EA',
              '#ffffff':'#FFFDF8',
              '#2f4e71':'#14213A',
              '#20395a':'#22405E',
              '#9a3d20':'#7A2231',
              '#b5965d':'#C9A227',
              '#deded8':'#DED5C2',
          }
          for old,new in replacements.items():
              text = text.replace(old,new)
          middleware.write_text(text, encoding='utf-8')

      - name: Commit live theme
        shell: bash
        run: |
          if git diff --quiet -- functions/_middleware.js dictionary-d1-preview.html dictionary-d1-preview-en.html; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/_middleware.js dictionary-d1-preview.html dictionary-d1-preview-en.html
          git commit -m "Apply navy-burgundy-gold theme to live Cloudflare dictionary"
          git push origin HEAD:main
