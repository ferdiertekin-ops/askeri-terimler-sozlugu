name: Apply live Cloudflare theme once

on:
  push:
    paths:
      - '.github/workflows/apply-live-cloudflare-theme-once.yml'

permissions:
  contents: write

jobs:
  apply-live-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Recolor live Cloudflare dictionary
        shell: bash
        run: |
          for f in functions/_middleware.js dictionary-d1-preview.html dictionary-d1-preview-en.html; do
            sed -i \
              -e 's/#2f4e71/#14213A/g' \
              -e 's/#2F4E71/#14213A/g' \
              -e 's/#20395a/#22405E/g' \
              -e 's/#20395A/#22405E/g' \
              -e 's/#9a3d20/#7A2231/g' \
              -e 's/#9A3D20/#7A2231/g' \
              -e 's/#b5965d/#C9A227/g' \
              -e 's/#B5965D/#C9A227/g' \
              -e 's/#f8f8f6/#F7F3EA/g' \
              -e 's/#fbfaf7/#FFFDF8/g' \
              -e 's/#f5f2ec/#F2ECDD/g' \
              -e 's/#1b1916/#14213A/g' \
              -e 's/#706b64/#5C5646/g' \
              -e 's/#ddd9d2/#DED5C2/g' \
              -e 's/#ebe8e2/#E7DFCF/g' \
              -e 's/#f0ebe1/#EFE7D5/g' \
              -e 's/#8a6a32/#7A2231/g' \
              -e 's/#ffffff/#FFFDF8/g' \
              -e 's/#deded8/#DED5C2/g' "$f"
          done

          sed -i 's/\.list-head span{color:#F7F3EA!important/\.list-head span{color:#C9A227!important/' functions/_middleware.js
          sed -i 's/\.list-head span{color:#FFFDF8!important/\.list-head span{color:#C9A227!important/' functions/_middleware.js

          for f in dictionary-d1-preview.html dictionary-d1-preview-en.html; do
            sed -i 's/background:rgba(251,250,247,.42)/background:#FFFDF8/g' "$f"
            sed -i 's/background:rgba(245,242,236,.58)/background:#F2ECDD/g' "$f"
            sed -i 's/background:#EFE7D5/bacKGROUND:#EFE7D5/g' "$f"
            sed -i 's/bacKGROUND:/background:/g' "$f"
          done

      - name: Commit live palette
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/_middleware.js dictionary-d1-preview.html dictionary-d1-preview-en.html
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Apply navy-burgundy-gold palette to live Cloudflare dictionary"
          git push origin HEAD:main
