name: Refine row hover once

on:
  push:
    paths:
      - '.github/workflows/refine-row-hover-once.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply mustard hover and focus frame
        shell: bash
        run: |
          cat > /tmp/patch_row_hover.py <<'PY'
          from pathlib import Path
          import sys

          css = r'''
          /* ATS ROW HOVER MUSTARD FRAME 2026-08-08 */
          .row:hover,
          .row:focus-visible,
          .row:active{
            border-bottom-color:#C9A227!important;
            box-shadow:
              inset 3px 0 0 #C9A227,
              inset 0 0 0 1px rgba(201,162,39,.82)!important;
          }
          .row:hover::before,
          .row:focus-visible::before,
          .row:active::before{
            background:#C9A227!important;
            border-color:#C9A227!important;
          }
          .row:focus-visible{
            outline:none!important;
          }
          '''

          marker = 'ATS ROW HOVER MUSTARD FRAME 2026-08-08'

          for filename in ['dictionary-d1-preview.html','dictionary-d1-preview-en.html']:
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              if marker not in text:
                  if '</head>' not in text:
                      raise RuntimeError(f'{filename}: </head> not found')
                  text = text.replace('</head>', '<style id="ats-row-hover-mustard-frame-20260808">' + css + '</style>\n</head>', 1)
                  p.write_text(text, encoding='utf-8')

          if len(sys.argv) > 1 and sys.argv[1] == 'main':
              p = Path('functions/_middleware.js')
              if p.exists():
                  text = p.read_text(encoding='utf-8')
                  if marker not in text:
                      start = text.find('const DICTIONARY_VISUAL_POLISH = `')
                      if start >= 0:
                          end = text.find('</style>', start)
                          if end >= 0:
                              text = text[:end] + css + '\n' + text[end:]
                              p.write_text(text, encoding='utf-8')
          PY

          python3 /tmp/patch_row_hover.py main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dictionary-d1-preview.html dictionary-d1-preview-en.html functions/_middleware.js
          if ! git diff --cached --quiet; then
            git commit -m "Use mustard row hover bar and frame"
            git push origin HEAD:main
          fi

          git fetch origin agent/cloudflare-migration
          git checkout -B agent/cloudflare-migration origin/agent/cloudflare-migration
          python3 /tmp/patch_row_hover.py branch
          git add dictionary-d1-preview.html dictionary-d1-preview-en.html
          if ! git diff --cached --quiet; then
            git commit -m "Use mustard row hover bar and frame"
            git push origin HEAD:agent/cloudflare-migration
          fi
