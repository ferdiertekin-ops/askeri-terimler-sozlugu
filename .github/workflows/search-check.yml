name: Dictionary search checks

on:
  pull_request:
    paths:
      - 'functions/api/terms.js'
      - 'functions/_middleware.js'
      - 'functions/_lib/editor.js'
      - 'dictionary-d1-preview.html'
      - 'dictionary-d1-preview-en.html'
      - 'scripts/check-response-latency.mjs'
      - 'functions/_lib/http.js'
      - 'functions/_lib/term-letter.js'
      - 'migrations/0001_initial.sql'
      - 'scripts/check-search.mjs'
      - 'scripts/check-editor-metadata.mjs'
      - 'assets/term-game.js'
      - 'scripts/check-term-game.mjs'
      - 'package.json'
      - '.github/workflows/search-check.yml'
  push:
    branches: [main]
    paths:
      - 'functions/api/terms.js'
      - 'functions/_middleware.js'
      - 'functions/_lib/editor.js'
      - 'dictionary-d1-preview.html'
      - 'dictionary-d1-preview-en.html'
      - 'scripts/check-response-latency.mjs'
      - 'functions/_lib/http.js'
      - 'functions/_lib/term-letter.js'
      - 'migrations/0001_initial.sql'
      - 'scripts/check-search.mjs'
      - 'scripts/check-editor-metadata.mjs'
      - 'assets/term-game.js'
      - 'scripts/check-term-game.mjs'
      - 'package.json'
      - '.github/workflows/search-check.yml'

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm run build
