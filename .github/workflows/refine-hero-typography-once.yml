name: Refine hero typography once

on:
  push:
    paths:
      - '.github/workflows/refine-hero-typography-once.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply hero typography refinement
        shell: bash
        run: |
          cat > /tmp/patch_hero_typography.py <<'PY'
          from pathlib import Path
          import sys

          css = r'''
          /* ATS HERO TYPOGRAPHY TIGHTEN 2026-08-08 */
          .preview-hero{
            margin-top:-18px!important;
            padding-top:0!important;
            padding-bottom:0!important;
          }
          .preview-title{
            gap:0!important;
          }
          .preview-eyebrow{
            top:-43px!important;
            font-family:Cambria,Georgia,serif!important;
            font-weight:700!important;
            line-height:1.05!important;
            letter-spacing:.18em!important;
          }
          .preview-title__top{
            margin:0!important;
            color:#9B7A17!important;
            font-family:Cambria,Georgia,serif!important;
            font-size:18px!important;
            line-height:1!important;
            font-weight:700!important;
            letter-spacing:.22em!important;
            text-indent:.22em!important;
          }
          .preview-title__main{
            margin-top:2px!important;
          }
          .preview-title__date{
            margin-top:3px!important;
            color:#9B7A17!important;
            font-family:Cambria,Georgia,serif!important;
            font-weight:700!important;
          }
          @media(max-width:900px){
            .preview-hero{margin-top:-12px!important}
            .preview-eyebrow{top:-38px!important}
            .preview-title__top{font-size:17px!important}
          }
          @media(max-width:760px){
            .preview-hero{margin-top:0!important;padding-top:2px!important}
            .preview-eyebrow{position:static!important;transform:none!important;margin-bottom:2px!important}
            .preview-title__top{font-size:16px!important}
          }
          '''

          marker = 'ATS HERO TYPOGRAPHY TIGHTEN 2026-08-08'

          for filename in ['dictionary-d1-preview.html','dictionary-d1-preview-en.html']:
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              if marker not in text:
                  if '</head>' not in text:
                      raise RuntimeError(f'{filename}: </head> not found')
                  text = text.replace('</head>', '<style id="ats-hero-typography-tighten-20260808">' + css + '</style>\n</head>', 1)
                  p.write_text(text, encoding='utf-8')

          if len(sys.argv) > 1 and sys.argv[1] == 'main':
              p = Path('functions/_middleware.js')
              if p.exists():
                  text = p.read_text(encoding='utf-8')
                  if marker not in text:
                      start = text.find('const DICTIONARY_VISUAL_POLISH = `')
                      if start >= 0:
                          end = text.find('</style>', start)
                          if end >= 0:
                              text = text[:end] + css + '\n' + text[end:]
                              p.write_text(text, encoding='utf-8')
          PY

          python3 /tmp/patch_hero_typography.py main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dictionary-d1-preview.html dictionary-d1-preview-en.html functions/_middleware.js
          if ! git diff --cached --quiet; then
            git commit -m "Tighten hero spacing and strengthen Cambria typography"
            git push origin HEAD:main
          fi

          git fetch origin agent/cloudflare-migration
          git checkout -B agent/cloudflare-migration origin/agent/cloudflare-migration
          python3 /tmp/patch_hero_typography.py branch
          git add dictionary-d1-preview.html dictionary-d1-preview-en.html
          if ! git diff --cached --quiet; then
            git commit -m "Tighten hero spacing and strengthen Cambria typography"
            git push origin HEAD:agent/cloudflare-migration
          fi
