name: Warm dictionary row tones once

on:
  push:
    paths:
      - '.github/workflows/warm-row-tones-once.yml'

permissions:
  contents: write

jobs:
  warm-rows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply warm grey row tones to main
        shell: python
        run: |
          from pathlib import Path

          override = '''\n/* ATS WARM GREY ROW TONES */\n.list{background:transparent!important}\n.row{background:#F1EFE8!important;border-bottom-color:#D7D0C2!important}\n.row:nth-child(even){background:#E8E4DA!important}\n.row:hover,.row:focus-visible{background:#DDD6C8!important;border-bottom-color:#C7BDAA!important}\n.cell{border-right-color:#D5CEC0!important}\n'''

          for filename in ['dictionary-d1-preview.html','dictionary-d1-preview-en.html']:
              p=Path(filename)
              text=p.read_text(encoding='utf-8')
              if 'ATS WARM GREY ROW TONES' not in text:
                  pos=text.find('</style>')
                  if pos == -1:
                      raise RuntimeError(f'{filename}: style kapanışı bulunamadı')
                  text=text[:pos]+override+text[pos:]
              p.write_text(text,encoding='utf-8')

          p=Path('functions/_middleware.js')
          text=p.read_text(encoding='utf-8')
          if 'ATS WARM GREY ROW TONES' not in text:
              start=text.find('const DICTIONARY_VISUAL_POLISH = `')
              if start == -1:
                  raise RuntimeError('DICTIONARY_VISUAL_POLISH bulunamadı')
              pos=text.find('</style>`;',start)
              if pos == -1:
                  raise RuntimeError('DICTIONARY_VISUAL_POLISH kapanışı bulunamadı')
              text=text[:pos]+override+text[pos:]
          p.write_text(text,encoding='utf-8')

      - name: Commit main row tones
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/_middleware.js dictionary-d1-preview.html dictionary-d1-preview-en.html
          if ! git diff --cached --quiet; then
            git commit -m "Warm dictionary row background tones"
            git push origin HEAD:main
          fi

      - name: Apply same tones to Cloudflare migration branch
        shell: bash
        run: |
          git fetch origin agent/cloudflare-migration
          git checkout -B agent/cloudflare-migration origin/agent/cloudflare-migration
          python - <<'PY'
          from pathlib import Path
          override='''\n/* ATS WARM GREY ROW TONES */\n.list{background:transparent!important}\n.row{background:#F1EFE8!important;border-bottom-color:#D7D0C2!important}\n.row:nth-child(even){background:#E8E4DA!important}\n.row:hover,.row:focus-visible{background:#DDD6C8!important;border-bottom-color:#C7BDAA!important}\n.cell{border-right-color:#D5CEC0!important}\n'''
          for filename in ['dictionary-d1-preview.html','dictionary-d1-preview-en.html']:
              p=Path(filename)
              text=p.read_text(encoding='utf-8')
              if 'ATS WARM GREY ROW TONES' not in text:
                  pos=text.find('</style>')
                  if pos == -1:
                      raise RuntimeError(f'{filename}: style kapanışı bulunamadı')
                  text=text[:pos]+override+text[pos:]
              p.write_text(text,encoding='utf-8')
          PY
          git add dictionary-d1-preview.html dictionary-d1-preview-en.html
          if ! git diff --cached --quiet; then
            git commit -m "Warm dictionary row background tones"
            git push origin HEAD:agent/cloudflare-migration
          fi
