name: Anthracite dictionary header once

on:
  push:
    paths:
      - '.github/workflows/anthracite-header-once.yml'

permissions:
  contents: write

jobs:
  refine-header:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply anthracite header to main
        shell: python
        run: |
          from pathlib import Path

          override = '''\n/* ATS ANTHRACITE HEADER */\n.list-head{background:#2B2B29!important;border-top-color:#3D3B36!important;border-bottom-color:#3D3B36!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.045)!important}\n.list-head span{color:#C9A227!important;text-shadow:none!important}\n'''

          for filename in ['dictionary-d1-preview.html','dictionary-d1-preview-en.html']:
              p=Path(filename)
              text=p.read_text(encoding='utf-8')
              if 'ATS ANTHRACITE HEADER' not in text:
                  pos=text.find('</style>')
                  if pos == -1:
                      raise RuntimeError(f'{filename}: style kapanışı bulunamadı')
                  text=text[:pos]+override+text[pos:]
              p.write_text(text,encoding='utf-8')

          p=Path('functions/_middleware.js')
          text=p.read_text(encoding='utf-8')
          if 'ATS ANTHRACITE HEADER' not in text:
              start=text.find('const DICTIONARY_VISUAL_POLISH = `')
              if start == -1:
                  raise RuntimeError('DICTIONARY_VISUAL_POLISH bulunamadı')
              pos=text.find('</style>`;',start)
              if pos == -1:
                  raise RuntimeError('DICTIONARY_VISUAL_POLISH kapanışı bulunamadı')
              text=text[:pos]+override+text[pos:]
          p.write_text(text,encoding='utf-8')

      - name: Commit main header
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/_middleware.js dictionary-d1-preview.html dictionary-d1-preview-en.html
          if ! git diff --cached --quiet; then
            git commit -m "Use anthracite and mustard dictionary header"
            git push origin HEAD:main
          fi

      - name: Apply same header to Cloudflare migration branch
        shell: bash
        run: |
          git fetch origin agent/cloudflare-migration
          git checkout -B agent/cloudflare-migration origin/agent/cloudflare-migration
          python - <<'PY'
          from pathlib import Path
          override='''\n/* ATS ANTHRACITE HEADER */\n.list-head{background:#2B2B29!important;border-top-color:#3D3B36!important;border-bottom-color:#3D3B36!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.045)!important}\n.list-head span{color:#C9A227!important;text-shadow:none!important}\n'''
          for filename in ['dictionary-d1-preview.html','dictionary-d1-preview-en.html']:
              p=Path(filename)
              text=p.read_text(encoding='utf-8')
              if 'ATS ANTHRACITE HEADER' not in text:
                  pos=text.find('</style>')
                  if pos == -1:
                      raise RuntimeError(f'{filename}: style kapanışı bulunamadı')
                  text=text[:pos]+override+text[pos:]
              p.write_text(text,encoding='utf-8')
          PY
          git add dictionary-d1-preview.html dictionary-d1-preview-en.html
          if ! git diff --cached --quiet; then
            git commit -m "Use anthracite and mustard dictionary header"
            git push origin HEAD:agent/cloudflare-migration
          fi
