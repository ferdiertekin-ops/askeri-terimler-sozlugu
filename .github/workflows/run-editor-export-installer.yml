name: Editör dışa aktarma kurulumunu çalıştır

on:
  push:
    paths:
      - .github/workflows/run-editor-export-installer.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Kurulum betiğini çalıştır
        run: python scripts/install-editor-export.py

      - name: JavaScript sözdizimini denetle
        run: |
          node --check functions/_lib/editor.js
          node --check functions/_middleware.js

      - name: Değişiklikleri kaydet
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/_lib/editor.js functions/_middleware.js editor-panel-private.html editor/export/index.html
          git commit -m "Editöre JSON ve CSV dışa aktarma ekle"
          git push origin HEAD:main
